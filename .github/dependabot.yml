version: 2
updates:
  # Actions are SHA-pinned, so dependabot is the only thing that will move them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Grouped because these versions move together: a Kotlin bump has to carry the
  # compose and serialization plugins with it, and AndroidX bumps often pull a
  # minimum AGP with them. One PR per group means CI verifies a coherent set.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    #
    # Everything here needs the app to compile against API 37, which is still a
    # preview SDK: it is not in sdkmanager's stable channel, so CI cannot even
    # install it, and shipping a release built against a preview API is not
    # something to do on purpose. Delete this block when API 37 goes stable and
    # bump compileSdk with it. This is not an AGP constraint; the project is on
    # AGP 9 already.
    ignore:
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.07.00"] # pulls Compose 1.12
      - dependency-name: "androidx.lifecycle:*"
        versions: [">=2.11.0"]
      - dependency-name: "com.squareup.okhttp3:*"
        versions: [">=5.5.0"]
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      androidx:
        patterns: ["androidx.*"]
      other-gradle:
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin*", "androidx.*"]
    # These cannot build until the AGP 9 migration happens (that plugin removes
    # org.jetbrains.kotlin.android entirely), so without these ignores dependabot
    # reopens a red PR every month. Drop them as part of that migration; the
    # blockers are recorded in CLAUDE.md under "Known upgrade chains".

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
