name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Floor through current stable. The floor is 3.11 because main.py uses
        # `X | None` annotations evaluated by pydantic at runtime.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: server
        # Runtime deps too: mypy needs fastapi and pydantic to resolve imports.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: server
        run: ruff check .
      - name: Format check
        working-directory: server
        run: ruff format --check .
      - name: Typecheck
        working-directory: server
        run: mypy .
      - name: Tests with coverage gate
        working-directory: server
        # Threshold lives in pyproject.toml (fail_under). Ratchet up, never down.
        run: |
          coverage run -m pytest
          coverage report

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # Deliberately the plain SDK path rather than the optional nix flake in
      # android/: CI then exercises the same toolchain the build docs tell
      # outside contributors to install.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests
        working-directory: android
        # Includes the HMAC parity tests, which assert the same
        # spec/hmac-vectors.json the server suite does.
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Android Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report
          path: android/app/build/reports/

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        # The installer and the example helpers are the parts someone else runs
        # on their own machine; a typo there is their first impression.
        run: shellcheck server/install.sh examples/bt-toggle examples/screen-off-toggle.sh

  ci-ok:
    needs: [server, android, shell]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo ok
